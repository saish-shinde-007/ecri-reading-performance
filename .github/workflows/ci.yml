name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        # Not --system: the runner's system interpreter is externally
        # managed (PEP 668) and is 3.12 regardless of the matrix leg.
        # setup-uv's python-version already built a venv at the right version
        # and exported VIRTUAL_ENV; putting its bin on GITHUB_PATH makes every
        # later step resolve ruff/pytest/ecri from it.
        run: |
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: Confirm the interpreter matches the matrix
        run: python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}'), sys.version; print(sys.version)"

      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools

      - name: Test
        # The real CSVs are never committed (CC BY-NC-SA, see docs/data.md), so
        # the whole suite runs against ecri.datagen. The coverage floor is the
        # gate that keeps that from quietly becoming a smoke test.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: End-to-end pipeline on synthetic data
        run: |
          ecri -q check
          ecri -q synth --rows 500
          ecri -q eda
          ecri -q baseline --repeats 3

      - name: Verify the derived label rule
        # Exits 2 when data/raw is empty, which is the normal CI case. Only a
        # genuine mismatch (exit 1) fails the build.
        run: |
          # `shell: bash -e` aborts on the non-zero exit before $? is read,
          # so the exit code has to be captured with errexit off.
          set +e
          python tools/verify_target_rule.py
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::real ECRI CSVs absent — label-rule check skipped"
          elif [ "$status" -ne 0 ]; then
            echo "::error::the derived label rule no longer reproduces"
            exit 1
          fi
