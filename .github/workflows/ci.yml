name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        # Not --system: the runner's system interpreter is externally
        # managed (PEP 668) and is 3.12 regardless of the matrix leg.
        # setup-uv's python-version already built a venv at the right version
        # and exported VIRTUAL_ENV; putting its bin on GITHUB_PATH makes every
        # later step resolve ruff/pytest/ecri from it.
        # From uv.lock, exactly. --locked fails the job if pyproject.toml changed
        # without re-locking, so the CI environment can never drift silently.
        run: |
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then uv sync --locked --extra dev --extra boost; else uv sync --locked --extra dev; fi

      - name: Confirm the interpreter matches the matrix
        run: python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}'), sys.version; print(sys.version)"

      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools

      - name: Test
        # The real CSVs are never committed (CC BY-NC-SA, see docs/data.md), so
        # the whole suite runs against ecri.datagen. The coverage floor is the
        # gate that keeps that from quietly becoming a smoke test.
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: End-to-end pipeline on synthetic data
        run: |
          ecri -q check
          ecri -q synth --rows 500
          ecri -q eda
          ecri -q baseline --repeats 3
          ecri -q cv --models logistic,random_forest,majority --repeats 2 --bootstrap 200
          ecri -q impute --repeats 1 --bootstrap 200
          ecri -q importance --models logistic --repeats 1
          ecri -q calibrate --repeats 1
          ecri -q school
          ecri -q model train --repeats 1 --out "$RUNNER_TEMP/bundle"
          ecri -q model verify "$RUNNER_TEMP/bundle" --cv
          ecri -q synth --rows 300 --features-only
          ecri -q rank data/interim/synthetic_rank_input.csv \
            --model-dir "$RUNNER_TEMP/bundle" --budget 10 --out "$RUNNER_TEMP/ranked.csv"
          test "$(($(wc -l < "$RUNNER_TEMP/ranked.csv") - 1))" -eq 10

      - name: Verify the derived label rule
        # Exits 2 when data/raw is empty, which is the normal CI case. Only a
        # genuine mismatch (exit 1) fails the build.
        run: |
          # `shell: bash -e` aborts on the non-zero exit before $? is read,
          # so the exit code has to be captured with errexit off.
          set +e
          python tools/verify_target_rule.py
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::real ECRI CSVs absent — label-rule check skipped"
          elif [ "$status" -ne 0 ]; then
            echo "::error::the derived label rule no longer reproduces"
            exit 1
          fi

  reproduce:
    # The reproduction gate on the real data, on a third machine (Linux x86-64)
    # besides the laptop and the M4. The data is fetched from the pinned commit
    # and verified by sha256 on this runner's disk only: never uploaded, never
    # cached, never committed (CC BY-NC-SA 4.0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install from the lock
        run: |
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          uv sync --locked --extra dev

      - name: Fetch the pinned data
        run: python tools/fetch_data.py

      - name: Reproduce the headline numbers
        run: ecri reproduce

